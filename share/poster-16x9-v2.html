<title>Filament Lab 宣传图 · 大标题风 16:9</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:#e6edf3; }
  .poster { width:1920px; height:1080px; position:relative; overflow:hidden;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(79,156,249,.22), transparent 60%),
      radial-gradient(1000px 500px at 5% 110%, rgba(34,195,166,.15), transparent 60%),
      #0d1117; }
  .grid-bg { position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:72px 72px; }
  .content { position:relative; padding:70px 90px; height:100%; display:flex; flex-direction:column; }

  .top { display:flex; justify-content:space-between; align-items:center; }
  .brand { font-size:30px; font-weight:800; letter-spacing:1px; }
  .brand span { color:#22c3a6; }
  .brand small { display:block; font-size:14px; color:#6b7a8f; font-weight:600; letter-spacing:4px; margin-top:3px; }
  .top-tag { font-size:16px; color:#9cc3ff; background:rgba(79,156,249,.12); border:1.5px solid rgba(79,156,249,.45);
    padding:9px 22px; border-radius:999px; font-weight:600; }

  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .hero .kicker { font-size:22px; color:#f9a54f; letter-spacing:6px; font-weight:700; margin-bottom:18px; }
  .hero h1 { font-size:110px; font-weight:900; letter-spacing:4px; line-height:1.18;
    background:linear-gradient(90deg,#e8f1ff,#4f9cf9 45%,#22c3a6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero h2 { font-size:44px; font-weight:800; margin-top:20px; letter-spacing:2px; color:#dbe6f2; }
  .hero h2 b { color:#f9a54f; }

  .stats { display:flex; justify-content:center; gap:70px; margin-top:52px; }
  .stat { text-align:center; }
  .stat b { display:block; font-size:64px; font-weight:900;
    background:linear-gradient(180deg,#fff,#9cc3ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat span { font-size:19px; color:#9aa7b8; letter-spacing:2px; }

  .footer { margin-top:40px; display:flex; justify-content:space-between; align-items:center; gap:34px;
    background:rgba(255,255,255,.035); border:1px solid #263041; border-radius:20px; padding:24px 34px; }
  .f-left { display:flex; align-items:center; gap:24px; }
  .dh { font-size:16px; color:#9cc3ff; background:rgba(79,156,249,.13); border:1px solid rgba(79,156,249,.5);
    padding:9px 20px; border-radius:10px; font-weight:700; white-space:nowrap; }
  .f-url { font-size:21px; color:#22c3a6; font-weight:800; letter-spacing:.5px; }
  .f-note { font-size:14.5px; color:#9aa7b8; margin-top:3px; }
  .f-right { display:flex; align-items:center; gap:20px; }
  .qr { width:128px; height:128px; background:#fff; border-radius:14px; padding:7px; }
  .qr img { width:100%; height:100%; display:block; }
  .qr-tip { font-size:13px; color:#6b7a8f; line-height:1.6; text-align:center; }
</style>
</head>
